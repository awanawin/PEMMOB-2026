<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        height: 100%;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 16px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      min-height: 100dvh;
      height: 100%;
    }
    @keyframes nuvoraBreatheLight {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 12px 24px rgba(67, 97, 238, 0.18));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 16px 36px rgba(67, 97, 238, 0.32)) drop-shadow(0 4px 18px rgba(81, 250, 193, 0.25));
      }
    }
    @keyframes glowPulseLight {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.97);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }
    .animate-nuvora-breathe {
      animation: nuvoraBreatheLight 3.4s ease-in-out infinite;
      will-change: transform, filter;
    }
    .animate-glow-pulse {
      animation: glowPulseLight 3.4s ease-in-out infinite;
      will-change: transform, opacity;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-nuvora-breathe,
      .animate-glow-pulse {
        animation: none !important;
      }
    }
  </style>

<body class="h-full w-full bg-[#f8faff] text-slate-800 font-body-md antialiased overflow-hidden select-none" style="background-color: rgb(251, 249, 246);">

<script>
    (function() {
      const btn = document.getElementById('btn-masuk');
      if (btn) {
        btn.addEventListener('click', function() {
          btn.classList.add('opacity-95', 'scale-[0.98]');
          setTimeout(() => {
            btn.classList.remove('opacity-95', 'scale-[0.98]');
          }, 150);
        });
      }
    })();
