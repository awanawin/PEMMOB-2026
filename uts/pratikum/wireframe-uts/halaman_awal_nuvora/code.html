<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        height: 100%;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 16px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      min-height: 100dvh;
      height: 100%;
    }
    @keyframes nuvoraBreatheLight {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 12px 24px rgba(67, 97, 238, 0.18));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 16px 36px rgba(67, 97, 238, 0.32)) drop-shadow(0 4px 18px rgba(81, 250, 193, 0.25));
      }
    }
    @keyframes glowPulseLight {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.97);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }
    .animate-nuvora-breathe {
      animation: nuvoraBreatheLight 3.4s ease-in-out infinite;
      will-change: transform, filter;
    }
    .animate-glow-pulse {
      animation: glowPulseLight 3.4s ease-in-out infinite;
      will-change: transform, opacity;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-nuvora-breathe,
      .animate-glow-pulse {
        animation: none !important;
      }
    }
  </style>
</head>
<body class="h-full w-full bg-[#f8faff] text-slate-800 font-body-md antialiased overflow-hidden select-none" style="background-color: rgb(249, 250, 251);">
<main class="h-full min-h-screen w-full flex flex-col justify-between relative bg-gradient-to-b from-[#f8faff] via-[#ffffff] to-[#f0f4ff] overflow-hidden pt-safe pb-safe" style="background-color: rgb(249, 250, 251); background-image: radial-gradient(rgb(209, 213, 219) 1px, transparent 1px); background-size: 20px 20px;">
<!-- Light Mode Ambient Glow Orbs -->




<!-- Delicate Geometric Background Accents -->
<div class="absolute inset-0 pointer-events-none opacity-45 flex items-center justify-center"><svg class="w-full h-full object-cover" fill="none" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg"><circle cx="195" cy="380" r="160" stroke="#9ca3af" stroke-dasharray="4 4" stroke-width="1" opacity="0.5"></circle><circle cx="195" cy="380" r="230" stroke="#d1d5db" stroke-dasharray="2 4" stroke-width="1" opacity="0.6"></circle><circle cx="195" cy="380" r="295" stroke="#e5e7eb" stroke-width="1"></circle></svg></div>
<!-- 1. TOP BADGE PILL -->
<div class="relative z-10 w-full flex items-center justify-center pt-5 px-margin"><div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-dashed border-gray-400 shadow-sm"><span class="w-2 h-2 rounded-full bg-gray-400"></span><span class="text-[11px] font-mono font-bold tracking-wider uppercase text-gray-700">[BADGE] SMART LEARNING ECOSYSTEM</span></div></div>
<!-- 2. TENGAH: LOGO & BRANDING -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 text-center">
<!-- Logo Container with breathing pulse and soft blue glow -->
<div class="relative mb-7 flex flex-col items-center justify-center"><div class="w-36 h-36 rounded-2xl bg-gray-100 border-2 border-dashed border-gray-400 relative overflow-hidden flex items-center justify-center shadow-sm"><svg class="absolute inset-0 w-full h-full text-gray-300 stroke-current" preserveAspectRatio="none" viewBox="0 0 100 100"><line stroke-width="1.5" x1="0" x2="100" y1="0" y2="100"></line><line stroke-width="1.5" x1="100" x2="0" y1="0" y2="100"></line></svg><div class="relative z-10 bg-white/90 px-2.5 py-1 rounded border border-gray-300 text-center"><span class="text-[11px] font-mono font-bold uppercase text-gray-600 tracking-wider">[LOGO_PLACEHOLDER]</span></div></div></div>
<!-- Typography -->
<div class="max-w-xs space-y-2"><div class="inline-block px-2 py-0.5 mb-1 bg-gray-200 text-gray-700 font-mono text-[10px] rounded uppercase tracking-widest font-semibold">H1 : App Title</div><h1 class="text-4xl font-black tracking-tight text-gray-900">Nuvora</h1><p class="text-base font-semibold text-gray-600 tracking-tight">Platform Pembelajaran Digital</p><div class="pt-2 flex items-center justify-center gap-2.5 text-xs text-gray-400 font-mono"><span class="inline-block w-8 h-[1px] bg-gray-300"></span><span class="font-medium text-gray-500 uppercase tracking-wide">Generasi Unggul &amp; Interaktif</span><span class="inline-block w-8 h-[1px] bg-gray-300"></span></div></div>
</div>
<!-- 3. BAWAH: SINGLE PRIMARY BUTTON -->
<div class="relative z-10 w-full px-6 pb-6 pt-2">
<div class="max-w-sm mx-auto w-full">
<button class="group relative w-full h-14 rounded-xl bg-gray-900 hover:bg-black active:bg-gray-800 text-white font-mono text-sm font-bold flex items-center justify-center gap-2 border-2 border-gray-700 shadow-sm transition-all focus:outline-none" id="btn-masuk" type="button"><span class="font-bold tracking-wide">[BTN: Masuk]</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>
</div>
</div>
</main>
<script>
    (function() {
      const btn = document.getElementById('btn-masuk');
      if (btn) {
        btn.addEventListener('click', function() {
          btn.classList.add('opacity-95', 'scale-[0.98]');
          setTimeout(() => {
            btn.classList.remove('opacity-95', 'scale-[0.98]');
          }, 150);
        });
      }
    })();
  </script>
