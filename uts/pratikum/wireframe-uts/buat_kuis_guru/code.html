<script>
  (function () {
    const cards = document.querySelectorAll('.option-card');
    cards.forEach((card) => {
      card.addEventListener('click', () => {
        cards.forEach((c) => {
          c.classList.remove('bg-secondary-container', 'text-on-secondary-container');
          c.classList.add('bg-surface-container-low', 'text-on-surface');
          
          const badge = c.querySelector('span.uppercase');
          if (badge) badge.remove();
          
          const iconContainer = c.querySelector('.check-icon');
          if (iconContainer) {
            iconContainer.classList.remove('bg-secondary', 'text-on-secondary');
            iconContainer.classList.add('bg-surface-container-highest', 'text-outline');
            const check = iconContainer.querySelector('.material-symbols-outlined');
            if (check) check.classList.add('opacity-0');
          }
        });

        card.classList.remove('bg-surface-container-low', 'text-on-surface');
        card.classList.add('bg-secondary-container', 'text-on-secondary-container');

        const wrapper = card.querySelector('.flex.items-center.gap-1\\.5');
        if (wrapper && !wrapper.querySelector('.uppercase')) {
          const badge = document.createElement('span');
          badge.className = 'font-label-sm text-label-sm uppercase tracking-wider text-secondary';
          badge.textContent = 'Benar';
          wrapper.insertBefore(badge, wrapper.firstChild);
        }

        const iconContainer = card.querySelector('.check-icon');
        if (iconContainer) {
          iconContainer.classList.remove('bg-surface-container-highest', 'text-outline');
          iconContainer.classList.add('bg-secondary', 'text-on-secondary');
          const check = iconContainer.querySelector('.material-symbols-outlined');
          if (check) check.classList.remove('opacity-0');
        }
      });
    });

    const addBtn = document.getElementById('add-question-btn');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        addBtn.classList.add('scale-95');
        setTimeout(() => addBtn.classList.remove('scale-95'), 150);
      });
    }

    const resetBtn = document.getElementById('reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        const questionInput = document.getElementById('question-text');
        if (questionInput) {
          questionInput.value = '';
          questionInput.focus();
        }
      });
    }
  })();
</script></main>
